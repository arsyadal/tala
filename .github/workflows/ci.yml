name: Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_artifacts:
        description: Build and upload release archives after tests pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows
            arch: x86_64
            runner: windows-2025
            asset_name: tala-windows-x86_64.zip
          - platform: Windows
            os: windows
            arch: aarch64
            runner: windows-11-arm
            asset_name: tala-windows-aarch64.zip
          - platform: Linux
            os: linux
            arch: x86_64
            runner: ubuntu-24.04
            asset_name: tala-linux-x86_64.tar.gz
          - platform: Linux
            os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            asset_name: tala-linux-aarch64.tar.gz
          - platform: macOS
            os: macos
            arch: x86_64
            runner: macos-15-intel
            asset_name: tala-macos-x86_64.tar.gz
          - platform: macOS
            os: macos
            arch: aarch64
            runner: macos-15
            asset_name: tala-macos-aarch64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify native Rust architecture
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          $archLine = rustc --print cfg | Where-Object { $_ -match '^target_arch="[^"]+"$' } | Select-Object -First 1
          if (-not $archLine) {
            throw "rustc did not report a target architecture"
          }
          $actualArch = [regex]::Match($archLine, '^target_arch="([^"]+)"$').Groups[1].Value
          if ($actualArch -ne $env:EXPECTED_ARCH) {
            throw "Expected native architecture $env:EXPECTED_ARCH, found $actualArch"
          }

      - name: Install Linux clipboard test dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb xauth

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Test clipboard with virtual display
        if: matrix.os == 'linux'
        env:
          TALA_TEST_CLIPBOARD: "1"
        run: xvfb-run -a cargo test --locked clipboard::tests::desktop_round_trip -- --ignored --exact

      - name: Test clipboard
        if: matrix.os != 'linux'
        env:
          TALA_TEST_CLIPBOARD: "1"
        run: cargo test --locked clipboard::tests::desktop_round_trip -- --ignored --exact

      - name: Exercise profile detection
        if: matrix.os != 'windows'
        run: ./target/debug/tala --list-profiles

      - name: Exercise profile detection
        if: matrix.os == 'windows'
        run: .\target\debug\tala.exe --list-profiles

      - name: Build release binary
        if: inputs.release_artifacts
        run: cargo build --release --locked

      - name: Archive Windows release binary
        if: inputs.release_artifacts && matrix.os == 'windows'
        shell: pwsh
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          New-Item -ItemType Directory -Path dist
          Compress-Archive -LiteralPath target/release/tala.exe -DestinationPath (Join-Path dist $env:ASSET_NAME)

      - name: Archive Unix release binary
        if: inputs.release_artifacts && matrix.os != 'windows'
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/$ASSET_NAME" tala

      - name: Upload release archive
        if: inputs.release_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 7
